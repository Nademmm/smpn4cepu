name: CI & Deployment Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: Run Automated Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, fileinfo, curl, zip, bcmath, gd, exif
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Vite Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel Testing Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force

      - name: Execute Tests (PHPUnit)
        run: php artisan test

  deploy-to-hostinger:
    name: Auto-Deploy to Hostinger Cloud
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile Fresh Production Assets
        run: |
          npm ci
          npm run build

      - name: Validate Deployment Configuration
        run: |
          if [ -z "$HOSTINGER_HOST" ] || [ -z "$HOSTINGER_USER" ] || [ -z "$HOSTINGER_SSH_KEY" ]; then
            echo "⚠️ Konfigurasi SSH Secrets belum lengkap di GitHub Repository Secrets:"
            [ -z "$HOSTINGER_HOST" ] && echo "  - HOSTINGER_HOST (Belum diisi - IP / Hostname SSH Hostinger)"
            [ -z "$HOSTINGER_USER" ] && echo "  - HOSTINGER_USER (Belum diisi - Username SSH, misal u652241328)"
            [ -z "$HOSTINGER_SSH_KEY" ] && echo "  - HOSTINGER_SSH_KEY (Belum diisi - Private Key SSH)"
            echo "Silakan lengkapi di GitHub: Repo Settings -> Secrets and variables -> Actions."
          else
            echo "✅ Konfigurasi SSH Secrets terdeteksi lengkap. Melanjutkan deploy via SSH..."
          fi

      - name: Upload Fresh Vite Build to Hostinger
        if: env.HOSTINGER_SSH_KEY != '' && env.HOSTINGER_HOST != '' && env.HOSTINGER_USER != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: "public/build"
          target: "${{ secrets.HOSTINGER_APP_DIR || '/home/u652241328/domains/smpn4cepu.sch.id/laravel_app' }}"
          strip_components: 0

      - name: Execute Remote Deployment via SSH
        if: env.HOSTINGER_SSH_KEY != '' && env.HOSTINGER_HOST != '' && env.HOSTINGER_USER != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script_stop: true
          script: |
            bash "${{ secrets.HOSTINGER_APP_DIR || '/home/u652241328/domains/smpn4cepu.sch.id/laravel_app' }}/deploy.sh"

      - name: Fallback Webhook Trigger (Optional)
        if: (env.HOSTINGER_SSH_KEY == '' || env.HOSTINGER_HOST == '' || env.HOSTINGER_USER == '') && env.DEPLOY_WEBHOOK_URL != ''
        run: |
          echo "Triggering deployment webhook..."
          curl -X POST -f "$DEPLOY_WEBHOOK_URL" || echo "Webhook trigger warning: Check URL secret."

      - name: Verify Live Website Health
        run: |
          echo "Verifying live site health..."
          curl -f -sI -k https://smpn4cepu.sch.id || exit 1
          echo "Production deployment is verified and healthy!"
