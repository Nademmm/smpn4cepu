# ========================================================
# Docker Compose: SMP Negeri 4 Cepu
# Penggunaan: Coolify (PaaS) atau Pengujian Lokal
# ========================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smpn4cepu-app:latest
    container_name: smpn4cepu_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "SMP Negeri 4 Cepu"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-smpn4cepu}"
      DB_USERNAME: "${DB_USERNAME:-smpn4_user}"
      DB_PASSWORD: "${DB_PASSWORD:-SecretPassword2026!}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      RUN_SEEDER: "${RUN_SEEDER:-false}"
    volumes:
      - app_storage:/app/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: smpn4cepu_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-RootSecret2026!}"
      MYSQL_DATABASE: "${DB_DATABASE:-smpn4cepu}"
      MYSQL_USER: "${DB_USERNAME:-smpn4_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-SecretPassword2026!}"
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-RootSecret2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
    name: smpn4cepu_app_storage
  mysql_data:
    name: smpn4cepu_mysql_data
